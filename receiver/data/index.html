<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAMS Receiver — WiFi Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand-header">
        <img src="/logo.jpg" class="brand-logo" alt="RAMS Logo" onError="if(this.src.endsWith('/logo.jpg')) this.src='/logo.png'; else this.style.display='none';">
        <h1>RAMS RECEIVER SETUP</h1>
      </div>
      <p class="subtitle">ROAD ACCIDENT MONITORING SYSTEM — CAPTIVE PORTAL</p>
    </div>

    <div id="connStatus" class="status disconnected">
      <span class="dot"></span>
      <span id="statusText">NOT CONNECTED</span>
    </div>

    <div class="section">
      <h2>Available Networks</h2>
      <div id="networks" class="network-list">
        <div class="scanning">
          <div class="spinner"></div>
          <span>Scanning networks...</span>
        </div>
      </div>
      <button class="btn btn-outline" onclick="scanNetworks()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        RESCAN NETWORKS
      </button>
    </div>

    <div class="section">
      <h2>Connect</h2>
      <div class="form-group">
        <label for="ssid">Network (SSID)</label>
        <input type="text" id="ssid" placeholder="Select network above or enter manually" required>
      </div>
      <div class="form-group">
        <label for="pass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="pass" placeholder="Enter WiFi password">
          <button class="btn-icon" onclick="togglePass()" title="Show password" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="btnConnect" onclick="doConnect()">CONNECT</button>
    </div>

    <div class="section">
      <h2>Device Status &amp; Diagnostics</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">IP Address</span>
          <span class="info-value" id="ipAddr">192.168.4.1</span>
        </div>
        <div class="info-item">
          <span class="info-label">Queue Size</span>
          <span class="info-value" id="queueSize">0 PACKETS</span>
        </div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="clearQueue()" style="margin-top:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        CLEAR OFFLINE QUEUE
      </button>
    </div>

    <div id="msgBox" class="msg hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
