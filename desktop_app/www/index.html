<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Road Accident Monitoring System — Live Operations Center</title>
    <meta name="description" content="Real-time road accident monitoring dashboard with clustered map view, color-coded event pins, and device profile popups. PGC Digital Innovation Challenge 2026." />
    
    <!-- Application Icons using RAMS Logo -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
      /* Standalone Splash Buffer Overlay Styling — 10s Cinematic Boot */
      #rams-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s ease;
      }

      /* Staggered fade-in for splash elements */
      .splash-fadein-1 { opacity: 0; animation: splash-stagger-in 0.8s ease-out 0.2s forwards; }
      .splash-fadein-2 { opacity: 0; animation: splash-stagger-in 0.8s ease-out 0.6s forwards; }
      .splash-fadein-3 { opacity: 0; animation: splash-stagger-in 0.8s ease-out 1.0s forwards; }
      .splash-fadein-4 { opacity: 0; animation: splash-stagger-in 0.8s ease-out 1.4s forwards; }
      .splash-fadein-5 { opacity: 0; animation: splash-stagger-in 0.8s ease-out 1.8s forwards; }

      @keyframes splash-stagger-in {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-logo-box {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-pulse-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid rgba(239, 68, 68, 0.4);
        box-shadow: 0 0 24px rgba(239, 68, 68, 0.3);
        animation: splash-pulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      }

      .splash-pulse-ring-inner {
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 2px solid rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
        animation: splash-pulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite 0.75s;
      }

      .splash-pulse-ring-outer {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 1px solid rgba(59, 130, 246, 0.25);
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        animation: splash-pulse 2.8s cubic-bezier(0.24, 0, 0.38, 1) infinite 1.2s;
      }

      @keyframes splash-pulse {
        0% { transform: scale(0.92); opacity: 0.8; }
        70% { transform: scale(1.4); opacity: 0; }
        100% { transform: scale(1.4); opacity: 0; }
      }

      .splash-logo-img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #27272a;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 40px rgba(239, 68, 68, 0.08);
        position: relative;
        z-index: 2;
        animation: splash-logo-breathe 3s ease-in-out infinite;
      }

      @keyframes splash-logo-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      .splash-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fafafa;
        margin: 0 0 6px 0;
        text-align: center;
      }

      .splash-badge {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 4px;
        background: #18181b;
        border: 1px solid #27272a;
        color: #10b981;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }

      .splash-dept {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #71717a;
        margin: 0 0 28px 0;
        text-align: center;
      }

      /* Deterministic progress bar — fills 0% to 100% over 10s */
      .splash-bar-track {
        width: 300px;
        height: 3px;
        background: #18181b;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 8px;
      }

      .splash-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #ef4444);
        border-radius: 9999px;
        animation: splash-progress-fill 10s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      @keyframes splash-progress-fill {
        0% { width: 0%; }
        8% { width: 6%; }
        16% { width: 14%; }
        24% { width: 24%; }
        32% { width: 33%; }
        40% { width: 42%; }
        50% { width: 53%; }
        60% { width: 64%; }
        70% { width: 74%; }
        80% { width: 84%; }
        90% { width: 92%; }
        100% { width: 100%; }
      }

      .splash-percent-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        color: #52525b;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
        text-align: center;
      }

      .splash-status-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #a1a1aa;
        text-align: center;
        min-height: 16px;
        transition: opacity 0.25s ease;
      }

      /* Subtle background grid/scan lines effect */
      #rams-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.008) 2px,
          rgba(255, 255, 255, 0.008) 4px
        );
        pointer-events: none;
        z-index: 0;
      }

      #rams-splash > * {
        position: relative;
        z-index: 1;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-B2ONumII.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Ca-riTUK.css">
  </head>
  <body>
    <!-- Standalone Initializing Buffer Overlay -->
    <div id="rams-splash">
      <div class="splash-logo-box splash-fadein-1">
        <div class="splash-pulse-ring-outer"></div>
        <div class="splash-pulse-ring"></div>
        <div class="splash-pulse-ring-inner"></div>
        <img src="/logo.jpg" alt="RAMS Logo" class="splash-logo-img" onerror="this.src='/logo.png'" />
      </div>

      <div class="splash-badge splash-fadein-2">OPERATIONS STATION • v2.0</div>
      <h1 class="splash-title splash-fadein-3">ROAD ACCIDENT MONITORING SYSTEM</h1>
      <p class="splash-dept splash-fadein-4">PGC DIGITAL INNOVATION CHALLENGE 2026</p>

      <div class="splash-fadein-5" style="display: flex; flex-direction: column; align-items: center;">
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
        <p id="splash-percent" class="splash-percent-text">0%</p>
        <p id="splash-status" class="splash-status-text">INITIALIZING TELEMETRY UPLINK...</p>
      </div>
    </div>

    <!-- Main React App Container -->
    <div id="root"></div>

    <!-- Splash Buffer Dismissal Script -->
    <script>
      (function() {
        var splash = document.getElementById('rams-splash');
        var status = document.getElementById('splash-status');
        var percent = document.getElementById('splash-percent');
        if (!splash) return;

        var messages = [
          'INITIALIZING TELEMETRY UPLINK...',
          'CALIBRATING GPS MODULE & TUGUEGARAO SECTOR...',
          'ESTABLISHING LoRa 915MHz FREQUENCY CHANNEL...',
          'SYNCHRONIZING BASE STATION RECEIVER...',
          'LOADING HIGH-PRECISION MAP TILE CACHE...',
          'CONNECTING RESCUE INCIDENT DATABASE...',
          'INITIALIZING CRASH DETECTION & AI LOGIC...',
          'VERIFYING RIDER REGISTRATION RECORDS...',
          'CONFIGURING EMERGENCY DISPATCH NETWORK...',
          'PERFORMING MULTI-SENSOR WEARABLE DIAGNOSTICS...',
          'FINALIZING COMMAND & RESCUER OPERATIONS CENTER...',
          'RESCUER OPERATIONS CENTER READY'
        ];
        var msgIdx = 0;
        var minBufferMs = 10000; // 10s cinematic boot buffer
        var startTime = Date.now();

        var msgIntervalMs = Math.floor(minBufferMs / messages.length);
        var msgTimer = setInterval(function() {
          msgIdx = (msgIdx + 1) % messages.length;
          if (status) status.textContent = messages[msgIdx];
        }, msgIntervalMs);

        var percentTimer = setInterval(function() {
          var elapsed = Date.now() - startTime;
          var pct = Math.min(100, Math.floor((elapsed / minBufferMs) * 100));
          if (percent) percent.textContent = pct + '%';
          if (pct >= 100) clearInterval(percentTimer);
        }, 50);

        function dismissSplash() {
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, minBufferMs - elapsed);
          setTimeout(function() {
            clearInterval(msgTimer);
            clearInterval(percentTimer);
            if (percent) percent.textContent = '100%';
            if (status) status.textContent = 'RESCUER OPERATIONS CENTER READY';
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              splash.remove();
            }, 750);
          }, remaining);
        }

        if (document.readyState === 'complete') {
          dismissSplash();
        } else {
          window.addEventListener('load', dismissSplash);
        }
      })();
    </script>
  </body>
</html>
